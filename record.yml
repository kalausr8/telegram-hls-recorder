name: HLS Recorder

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Stream page URL"
        required: true
        type: string

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-telegram-bot aiohttp

      - name: Install Chromium
        run: |
          playwright install --with-deps chromium

      - name: Start recording
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
        run: |
          python record_once.py "${{ inputs.url }}"
