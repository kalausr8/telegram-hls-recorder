name: HLS Recorder

run-name: TGREC-${{ github.event.client_payload.record_id }}

on:
  repository_dispatch:
    types: [telegram_record]

concurrency:
  group: TGREC-${{ github.event.client_payload.record_id }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-telegram-bot aiohttp

      - name: Install Chromium
        run: |
          playwright install --with-deps chromium

      - name: Start recording
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: kalausr8
          GITHUB_REPO: telegram-hls-recorder
          RECORD_ID: ${{ github.event.client_payload.record_id }}
          TARGET_USERNAME: ${{ github.event.client_payload.username }}
        run: |
          python record_once.py "${{ github.event.client_payload.url }}"
